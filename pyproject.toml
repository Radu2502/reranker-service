[project]
name = "reranker-service"
version = "0.1.0"
description = "Cross-encoder reranking of retrieved chunks for the Akadion RAG chatbot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.139.2",
    "sentence-transformers>=5.6.0",
    # Declarat explicit, deși vine tranzitiv prin sentence-transformers:
    # [tool.uv.sources] se aplică doar dependențelor directe, iar fără el
    # torch vine de pe PyPI cu cuda-toolkit și ~4.5 GB de wheel-uri NVIDIA.
    "torch>=2.0",
    # OpenTelemetry: instrumentare automată FastAPI + export OTLP către Jaeger.
    "opentelemetry-distro>=0.50b0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "mypy>=2.3.1",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.coverage.run]
source = ["main", "models"]
branch = true

[tool.coverage.report]
show_missing = true
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "ASYNC", "S", "T20"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]
"conftest.py" = ["ANN"]
"proba_reranker.py" = ["T20"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disallow_untyped_defs = false
